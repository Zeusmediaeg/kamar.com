 articles:[
  {s:'sticker-roll-riyadh',t:'طباعة ستيكر رول في الرياض: كيف تختار المصنع المناسب لمنتجك؟',d:'دليل عملي لاختيار مصنع طباعة ستيكر رول في الرياض: الجودة، الخامات، الدقة، السعر وسرعة التسليم.',k:'طباعة ستيكر رول، مصنع ستيكر رول في الرياض، مطبعة ستيكر رول',img:A+'12.jpg',b:'اختيار مصنع طباعة ستيكر رول قرار يؤثر مباشرة على شكل منتجك في السوق. الملصق هو أول ما يراه العميل، ولذلك تحتاج مصنعًا يهتم بالتفاصيل لا بالسعر فقط.\n\n## معايير الاختيار\n\nاسأل عن تنوع الخامات (ورق، بلاستيك، ميتالايز، حراري)، وعن ثبات الألوان ودقة القص، وهل تتوفر عينات سابقة تشبه منتجك. راجع أيضًا قدرة المصنع على طباعة كميات كبيرة دون انقطاع.\n\n## السعر والجودة\n\nالسعر الأفضل لا يعني الأرخص؛ الأفضل أن تحصل على جودة ثابتة وسعر عادل. في مصنع قمر الإنتاج نرسل لك عرض السعر بعد معرفة الكمية والخامة والمقاس.'},
  {s:'sticker-materials',t:'خامات ستيكر الرول: ورق أم بلاستيك أم ميتالايز؟ دليل الاختيار',d:'الفرق بين ستيكر الورق والبلاستيك الأبيض والشفاف والميتالايز والحراري، ومتى تستخدم كل خامة لمنتجك.',k:'خامات ستيكر، ستيكر بلاستيك شفاف، ستيكر ميتالايز، ستيكر ورق حراري',img:A+'11.jpg',b:'لكل منتج خامة تناسبه. اختيار الخامة الخاطئة قد يعني ملصقًا يتلف بالرطوبة أو لا يظهر بالشكل المطلوب.\n\n## الورق الأبيض\n\nاقتصادي ومناسب للمنتجات الجافة والاستخدامات العامة.\n\n## البلاستيك الأبيض والشفاف\n\nيقاوم الماء والزيوت، والشفاف يعطي مظهر العبوة بلا ملصق ظاهر.\n\n## الميتالايز\n\nسطح معدني لامع يمنح المنتج مظهرًا فاخرًا، ويناسب العطور والتجميل والهدايا.\n\n## الورق الحراري\n\nمخصص لملصقات الشحن والأسعار والباركود. وتستطيع إضافة طبقة سولفان للحماية واللمعان.'},

  {s:'sticker-roll-price',t:'سعر طباعة ستيكر رول: ما العوامل التي تحدد التكلفة؟',d:'اعرف العوامل التي تؤثر على سعر طباعة ستيكر الرول: الخامة، المقاس، عدد الألوان، الفويل، الكمية وشكل القص.',k:'سعر طباعة ستيكر رول، تكلفة طباعة ملصقات، طباعة ستيكر بالجملة',img:A+'6.jpg',b:'يسأل كثير من العملاء عن سعر طباعة الستيكر قبل أن يحددوا مواصفاته. الحقيقة أن السعر يعتمد على عدة عوامل واضحة.\n\n## ما الذي يحدد السعر؟\n\nنوع الخامة، والمقاس، وعدد الألوان، وإضافة الفويل أو السولفان، وشكل القص، وبالطبع الكمية؛ كلما زادت الكمية انخفضت تكلفة الوحدة.\n\n## كيف تحصل على سعر دقيق؟\n\nأرسل لنا الكمية ونوع الخامة والمقاس وسنرد عليك في أسرع وقت بعرض سعر واضح.'},

function route(){
 const h=location.hash,v=h==='#admin'?'a':h==='#portfolio'?'p':h.startsWith('#art-')?'r':'s',S=D.site;
 if(v==='s'&&cv==='s'){const e=/^#[a-z0-9]+$/.test(h)&&document.querySelector(h);e?e.scrollIntoView():window.scrollTo(0,0);return}
 cv=v;window.scrollTo(0,0);
 if(v==='a'){document.title='لوحة التحكم';$('#app').innerHTML=admin()}
 else if(v==='p'){setSeo('بورتفوليو '+S.name+' | مصنع ستيكر رول في الرياض',S.seoDesc,kwl('seo'),siteLD());$('#app').innerHTML=portfolio()}
 else if(v==='r'){const a=D.articles.find(x=>'#art-'+x.s===h);if(!a){location.hash='';return}
  setSeo(a.t+' | '+S.name,a.d,String(a.k||'').split(/[,،]/).map(x=>x.trim()).filter(Boolean).concat(kwl('seo').slice(0,6)),{'@context':'https://schema.org','@type':'Article','headline':a.t,'description':a.d,'inLanguage':'ar','author':{'@type':'Organization','name':S.name},'publisher':{'@type':'Organization','name':S.name}});
  $('#app').innerHTML=art(a)}
 else{setSeo(S.name+' | مصنع ستيكر رول في الرياض - طباعة ستيكر بجودة عالية',S.seoDesc,[...kwl('seo'),...kwl('ai'),...kwl('aud')],siteLD());$('#app').innerHTML=site();if(/^#[a-z0-9]+$/.test(h))setTimeout(()=>{const e=document.querySelector(h);e&&e.scrollIntoView()},50)}
}
document.addEventListener('click',e=>{
 const t=e.target,c=t.closest('[data-c]'),z=t.closest('[data-z]'),tb=t.closest('[data-tab]'),ac=t.closest('[data-act]'),ad=t.closest('[data-add]'),dl=t.closest('[data-del]'),mv=t.closest('[data-mv]');
 if(c){flt=c.dataset.c;$('#wk').innerHTML=works();document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.c===flt))}
 else if(z){const l=$('#lb');l.firstElementChild.src=z.src;l.classList.add('on')}
 else if(t.closest('#lb'))$('#lb').classList.remove('on');
 else if(tb){tab=tb.dataset.tab;$('#app').innerHTML=admin()}
 else if(ad){const k=ad.dataset.add,o={},fl=k==='sections'?[]:SEC[k.endsWith('.items')?'csitems':k];fl.forEach(f=>o[f[0]]='');if(k==='articles')o.s='a'+Date.now().toString(36);if(k==='sections')Object.assign(o,{t:'',tag:'',d:'',layout:'cards',nav:'1',pf:'1',items:[]});get(k).unshift(o);$('#app').innerHTML=admin()}
 else if(dl){if(confirm('تأكيد الحذف؟')){const pt=dl.dataset.del.split('.'),i=pt.pop();get(pt.join('.')).splice(+i,1);save('تم الحذف');$('#app').innerHTML=admin()}}
 else if(mv){const pt=mv.dataset.mv.split('.'),d=pt.pop(),i=pt.pop(),a=get(pt.join('.')),j=+i+ +d;if(j>=0&&j<a.length){[a[i],a[j]]=[a[j],a[i]];save('تم الترتيب');$('#app').innerHTML=admin()}}
 else if(t.closest('[data-clr]')){setp(t.closest('[data-clr]').dataset.clr,'');save('تم');$('#app').innerHTML=admin()}
 else if(ac){const a=ac.dataset.act;
  if(a==='savemap'){save();$('#app').innerHTML=admin()}
  if(a==='save'){save();applyTracking()}
  if(a==='out'){loggedIn=false;sessionStorage.removeItem('zq_in');route()}
  if(a==='exp'){const b=new Blob([JSON.stringify(D,null,1)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='data.json';l.click()}
  if(a==='rst'&&confirm('هيتمسح كل اللي اتعدل في المتصفح ده؟')){localStorage.removeItem('zq_data');location.reload()}
  if(a==='cred'){const u=$('#nu').value.trim(),p=$('#np').value;if(u.length<3||p.length<6)return toast('الاسم 3 حروف+ والباسورد 6+');localStorage.setItem('zq_auth',JSON.stringify({u,p}));toast('تم حفظ بيانات الدخول')}}
});
document.addEventListener('input',e=>{const p=e.target.dataset&&e.target.dataset.p;if(p)setp(p,e.target.value)});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.chk){setp(t.dataset.chk,t.checked?'1':'');return}
 if(t.dataset.up&&t.files[0])resize(t.files[0],u=>{setp(t.dataset.up,u);save('تم رفع الصورة');$('#app').innerHTML=admin()});
 if(t.dataset.imp!==undefined&&t.files[0]){const r=new FileReader();r.onload=()=>{try{D=merge(JSON.parse(JSON.stringify(DEF)),JSON.parse(r.result));save('تم الاستيراد');$('#app').innerHTML=admin()}catch(x){toast('ملف غير صالح')}};r.readAsText(t.files[0])}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').classList.remove('on')});
window.addEventListener('hashchange',route);
load().then(()=>{applyTracking();route()});
</script>
</body>
